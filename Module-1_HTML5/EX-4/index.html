<!DOCTYPE html>
<html>
<head>
    <title>Event Gallery</title>

    <style>
        .eventImage {
            border: 2px solid black;
            width: 150px;
            height: 100px;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <td>
            <img src="event1.jpg" alt="Music Event"
                 title="Music Event"
                 class="eventImage">
            <p>Music Festival</p>
        </td>

        <td>
            <img src="event2.jpg" alt="Sports Event"
                 title="Sports Event"
                 class="eventImage">
            <p>Sports Day</p>
        </td>

        <td>
            <img src="event3.jpg" alt="Food Event"
                 title="Food Event"
                 class="eventImage">
            <p>Food Fair</p>
        </td>
    </tr>

    <tr>
        <td>
            <img src="event4.jpg" alt="Workshop"
                 title="Workshop"
                 class="eventImage">
            <p>Workshop</p>
        </td>

        <td>
            <img src="event5.jpg" alt="Dance Event"
                 title="Dance Event"
                 class="eventImage">
            <p>Dance Show</p>
        </td>

        <td>
            <img src="event6.jpg" alt="Art Event"
                 title="Art Event"
                 class="eventImage">
            <p>Art Exhibition</p>
        </td>
    </tr>
</table>

</body>
</html>
